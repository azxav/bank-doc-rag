services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_LOCATION: ""
      QDRANT_PATH: ""
      APP_ENV: development
    depends_on:
      - qdrant

volumes:
  qdrant-data:
