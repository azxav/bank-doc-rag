[project]
name = "bank-doc-rag"
version = "0.1.0"
description = "Personal multilingual bank-document RAG portfolio project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langgraph>=0.2.60",
    "prometheus-client>=0.21.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "PyJWT>=2.10.0",
    "python-dotenv>=1.1.0",
    "qdrant-client>=1.13.0",
    "slowapi>=0.1.9",
    "structlog>=25.1.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]
observability = [
    "langfuse>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "evals/reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
